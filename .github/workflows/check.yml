# Every push and pull request runs the same offline checks a developer runs.
name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./tools/validate.sh
      - run: make dist
      # The installer must at least run far enough to render the policy and
      # build a plan. It is not applied here; nothing is changed on the runner.
      - name: Status runs on a real Linux host
        run: ./dist/agentfence --role login || [ $? -eq 1 ]
      - name: Status runs with site paths set
        env:
          AGENTFENCE_SHARED_HOMES: /shared/home
          AGENTFENCE_SHARED_APPS: /shared/apps
          AGENTFENCE_SHARED_WORKSPACES: /shared/projects
        run: ./dist/agentfence --role login || [ $? -eq 1 ]
      - name: --config is read, and beats the environment
        run: |
          cat > /tmp/t.conf <<'EOF'
          # a comment
          AGENTFENCE_SHARED_HOMES="/shared/home /export/home"
          AGENTFENCE_SHIM_AGENTS="copilot aider"
          NOT_A_REAL_KEY="x"
          EOF
          out=$(AGENTFENCE_SHARED_HOMES=/env/home ./dist/agentfence --role login --config /tmp/t.conf || [ $? -eq 1 ])
          printf '%s\n' "$out"
          printf '%s' "$out" | grep -q "/shared/home /export/home"
          printf '%s' "$out" | grep -qv "/env/home" || { echo "--config did not override the environment"; exit 1; }
          printf '%s' "$out" | grep -q "ignoring unknown setting"
          printf '%s' "$out" | grep -q "bin/aider"

      - name: config reports each value and where it came from
        run: |
          out=$(AGENTFENCE_MEMORY_MAX=64G ./dist/agentfence config --config /tmp/t.conf)
          printf '%s\n' "$out"
          printf '%s' "$out" | grep -qE 'AGENTFENCE_MEMORY_MAX +64G +environment'
          printf '%s' "$out" | grep -qE 'AGENTFENCE_SHARED_HOMES .*/tmp/t.conf'
          printf '%s' "$out" | grep -qE 'AGENTFENCE_CPU_QUOTA +400% +default'

      - name: init scaffolds, is not destructive, and round-trips
        run: |
          ./dist/agentfence init --config ./site.conf --policy-dir ./policy
          test -f ./site.conf
          test -f ./policy/managed-settings.overlay.json
          test -f ./policy/README
          test -f ./policy/managed-settings.json.shipped

          # An inline comment after a quoted value must not reach the value.
          # If it does, the cap lands in the systemd drop-in as garbage and is
          # silently not applied.
          sed -i 's|AGENTFENCE_MEMORY_MAX="16G"|AGENTFENCE_MEMORY_MAX="48G"|' ./site.conf
          out=$(./dist/agentfence config --config ./site.conf)
          printf '%s\n' "$out"
          printf '%s' "$out" | grep -qE 'AGENTFENCE_MEMORY_MAX +48G +\./site\.conf'

          # Re-running must not overwrite an edited file.
          ./dist/agentfence init --config ./site.conf --policy-dir ./policy
          grep -q '48G' ./site.conf

      - name: A policy overlay reaches the installed file
        run: |
          printf '%s' '{"permissions":{"deny":["Bash(docker *)"]}}' \
            > ./policy/managed-settings.overlay.json
          printf -- '-w /srv/secrets -p rwa -k site-secrets\n' \
            > ./policy/50-agentfence-audit.rules.append
          sudo ./dist/agentfence apply --role login --yes --no-packages \
            --config ./site.conf --policy-dir ./policy
          sudo grep -q 'Bash(docker \*)' /etc/claude-code/managed-settings.json
          sudo grep -q 'Bash(sudo \*)'   /etc/claude-code/managed-settings.json
          sudo grep -q 'site-secrets'     /etc/audit/rules.d/50-agentfence-audit.rules
          sudo grep -q 'agentfence-config' /etc/audit/rules.d/50-agentfence-audit.rules
          sudo ./dist/agentfence uninstall --role login --yes

      - name: A missing --config or --policy-dir is an error, not a default
        run: |
          if ./dist/agentfence --role login --config /nope/missing.conf; then
            echo "expected a refusal for --config"; exit 1
          fi
          if ./dist/agentfence --role login --policy-dir /nope/missing; then
            echo "expected a refusal for --policy-dir"; exit 1
          fi

      - name: A bad site path is refused
        run: |
          if AGENTFENCE_SHARED_HOMES=relative/path ./dist/agentfence --role login; then
            echo "expected a refusal"; exit 1
          fi

  # The runner is a disposable Linux VM with root, so it is the one place
  # `apply` can actually be exercised. This is the only automated evidence
  # that the installer converges; a real multi-user node is still untested.
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make dist

      - name: Apply
        env:
          AGENTFENCE_SITE_NAME: CI runner
          AGENTFENCE_SHARED_HOMES: /shared/home
          AGENTFENCE_SHARED_APPS: /shared/apps
          AGENTFENCE_SHARED_WORKSPACES: /shared/projects
        run: sudo -E ./dist/agentfence apply --role login --yes --no-packages

      - name: The policy that landed is valid JSON and carries the site paths
        run: |
          sudo cat /etc/claude-code/managed-settings.json | python3 -c '
          import json, sys
          s = json.load(sys.stdin)
          fs = s["sandbox"]["filesystem"]
          assert "//shared/home" in fs["denyRead"], fs["denyRead"]
          assert "//shared/apps" in fs["denyWrite"], fs["denyWrite"]
          assert "//shared/projects" in fs["allowRead"], fs["allowRead"]
          assert "Read(//shared/home/**/.ssh/**)" in s["permissions"]["deny"]
          assert s["sandbox"]["failIfUnavailable"] is True
          print("policy ok")'

      # Applying twice must be a no-op. This is the convergence claim, and it
      # is also what makes `status` from cron meaningful.
      - name: Status now reports no drift, without the variables set
        run: sudo ./dist/agentfence --role login

      - name: Applying again changes nothing
        run: |
          out=$(sudo ./dist/agentfence apply --role login --yes --no-packages)
          printf '%s\n' "$out"
          printf '%s' "$out" | grep -q "already matches"

      - name: Drift is detected and repaired
        run: |
          echo "tampered" | sudo tee /etc/claude-code/managed-settings.json >/dev/null
          if sudo ./dist/agentfence --role login; then
            echo "status should have reported drift"; exit 1
          fi
          sudo ./dist/agentfence apply --role login --yes --no-packages
          sudo ./dist/agentfence --role login

      - name: Uninstall removes what it installed
        run: |
          sudo ./dist/agentfence uninstall --role login --yes
          for f in /etc/claude-code/managed-settings.json \
                   /etc/agentfence/site.env \
                   /etc/profile.d/10-agentfence.sh; do
            if [ -e "$f" ]; then echo "$f survived uninstall"; exit 1; fi
          done
          echo "clean"
