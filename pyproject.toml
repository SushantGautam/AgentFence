# The uvx entry point. AgentFence is a shell installer; this packaging exists
# only so it can be fetched and run in one command on a throwaway machine.
#
# For a production node prefer the release artefact, which can be checksummed
# before anything runs as root. See "Install" in README.md.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentfence"
version = "0.1.0"
description = "AgentFence: guardrails for AI coding agents on shared Linux hosts"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }

[project.urls]
Homepage = "https://github.com/SushantGautam/agentfence"

[project.scripts]
agentfence = "agentfence.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["python/agentfence"]

# Builds dist/agentfence from files/ and drops it inside the wheel, so the
# wheel and the release artefact are the same bytes from the same source.
[tool.hatch.build.targets.wheel.hooks.custom]
path = "python/hatch_build.py"

[tool.hatch.build.targets.sdist]
include = ["python", "files", "scripts", "Makefile", "README.md", "AGENTS.md", "LICENSE"]
